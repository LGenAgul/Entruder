[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entruder"
version = "1.0.0"
description = "Entra ID and Azure attack toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "msal>=1.28",
    "requests>=2.31",
    "rich>=13.7",
    "cryptography>=42.0",
    "jsonschema>=4.21",
    "impacket>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
entruder = "entruder.cli:app"

[tool.setuptools.packages.find]
include = ["entruder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
