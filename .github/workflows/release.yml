name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach binaries to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: entruder-linux-amd64
            binary_path: dist/entruder
          - os: windows-latest
            asset_name: entruder-windows-amd64.exe
            binary_path: dist/entruder.exe
          - os: macos-latest
            asset_name: entruder-macos-arm64
            binary_path: dist/entruder

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name entruder entruder.py

      - name: Smoke test binary
        shell: bash
        run: "${{ matrix.binary_path }} --help"

      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.binary_path }}" "dist/${{ matrix.asset_name }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
